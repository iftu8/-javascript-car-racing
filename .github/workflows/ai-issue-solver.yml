name: Ultimate AI Game Developer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-code-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Official Google AI SDK
        run: pip install google-generativeai

      - name: 4. Create and Execute AI Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > ai_brain.py
          import os
          import sys
          import re
          import google.generativeai as genai

          def main():
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("❌ Error: GEMINI_API_KEY is missing!")
                  sys.exit(1)

              genai.configure(api_key=api_key)

              print("🔍 Scanning your API Key for available models...")
              available_models = []
              try:
                  for m in genai.list_models():
                      if 'generateContent' in m.supported_generation_methods:
                          available_models.append(m.name)
              except Exception as e:
                  print(f"❌ Failed to list models: {e}")
                  sys.exit(1)
              
              if not available_models:
                  print("❌ Error: Your API key does not have access to any content generation models.")
                  sys.exit(1)
                  
              # 🎯 Auto-detect the best model
              selected_model = available_models[0]
              for m in available_models:
                  if '1.5-flash' in m:
                      selected_model = m
                      break
                  elif '1.5-pro' in m:
                      selected_model = m
                  elif '1.0-pro' in m and '1.5' not in selected_model:
                      selected_model = m

              print(f"🎯 Perfectly Selected Model: {selected_model}")

              issue_title = os.environ.get("ISSUE_TITLE", "No Title")
              issue_body = os.environ.get("ISSUE_BODY", "No Body")
              file_path = "index.html"
              
              current_code = ""
              if os.path.exists(file_path):
                  with open(file_path, "r", encoding="utf-8") as f:
                      current_code = f.read()

              prompt = f"""You are an elite expert game developer. Refactor and upgrade the HTML5 Canvas game. Make it ultra-smooth, high-graphics, and highly standard.
              
              Issue Title: {issue_title}
              Issue Description: {issue_body}
              
              Current Code:
              {current_code}
              
              STRICT RULES:
              1. Provide ONLY valid HTML/CSS/JS code. No explanations.
              2. Do NOT use external files. Write everything inside a single HTML file.
              3. DO NOT output markdown blocks like ```html. Start exactly with <!DOCTYPE html> and end with </html>.
              """

              print(f"⏳ Sending request to {selected_model}... This might take a few minutes.")
              try:
                  # Use the exact model name fetched from Google's servers
                  clean_model_name = selected_model.replace('models/', '')
                  model = genai.GenerativeModel(clean_model_name)
                  response = model.generate_content(prompt)
                  
                  new_code = response.text
                  
                  new_code = re.sub(r'^```(html|javascript|css)?\s*', '', new_code, flags=re.IGNORECASE)
                  new_code = re.sub(r'```$', '', new_code.strip())

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(new_code)
                      
                  print(f"✅ AI successfully engineered the game using {clean_model_name}!")
              except Exception as e:
                  print(f"❌ Error during generation: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          
          python ai_brain.py

      - name: 5. Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: Extended Ultra AI Update"
          title: "🚀 Ultra Game Update: ${{ github.event.issue.title }}"
          body: "This update was perfectly generated using dynamic model selection."
          branch: "ultra-update-${{ github.event.issue.number }}"
          delete-branch: true
