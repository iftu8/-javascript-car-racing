name: Auto AI Issue Resolver

on:
  issues:
    types: [opened, edited]

# পারমিশনগুলো অত্যন্ত জরুরি, নাহলে PR তৈরি হবে না
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-solve:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Create Bulletproof AI Script
        run: |
          cat << 'EOF' > ai_script.js
          const fs = require('fs');

          async function main() {
            try {
              const apiKey = process.env.GEMINI_API_KEY;
              const issueTitle = process.env.ISSUE_TITLE;
              const issueBody = process.env.ISSUE_BODY;
              
              if (!apiKey) {
                console.error("❌ Error: GEMINI_API_KEY is missing in Secrets!");
                process.exit(1);
              }

              // Read the current game code to provide context to Gemini
              let currentCode = "";
              if (fs.existsSync('index.html')) {
                currentCode = fs.readFileSync('index.html', 'utf8');
              } else {
                console.error("❌ Error: index.html not found in repository.");
                process.exit(1);
              }

              // The Mastermind Prompt for Gemini 1.5 Pro
              const promptText = `You are a Senior Web Game Developer. 
              Update the following HTML5/JS game based on this GitHub issue request.
              
              Issue Title: ${issueTitle}
              Issue Details: ${issueBody}
              
              Current Game Code:
              ${currentCode}
              
              IMPORTANT INSTRUCTIONS:
              1. Implement the requested features flawlessly.
              2. Provide ONLY the complete updated source code.
              3. Do NOT wrap the code in markdown blocks (e.g., no \`\`\`html or \`\`\`).
              4. The response must start exactly with <!DOCTYPE html> and end with </html>.
              5. Keep all CSS, JS, and HTML strictly inside this single file.`;

              console.log("🚀 Sending request to Gemini 1.5 Pro API...");

              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: promptText }] }],
                  generationConfig: { temperature: 0.2 } // Low temp for more accurate coding
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                console.error("❌ API Call Failed:", errorText);
                process.exit(1);
              }

              const data = await response.json();
              let newCode = data.candidates[0].content.parts[0].text;
              
              // Fallback Regex to strictly clean any markdown AI might accidentally generate
              newCode = newCode.replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '').trim();
              
              // Save the updated code
              fs.writeFileSync('index.html', newCode);
              console.log("✅ File index.html successfully updated by Gemini!");
              
            } catch (error) {
              console.error("❌ Script Fatal Error:", error);
              process.exit(1);
            }
          }

          main();
          EOF

      - name: 4. Execute AI Magic (Call Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node ai_script.js

      - name: 5. Create Auto Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: automated game upgrade for Issue #${{ github.event.issue.number }}"
          title: "🤖 AI Update: ${{ github.event.issue.title }}"
          body: "This PR was engineered automatically by **Gemini 1.5 Pro** based on Issue #${{ github.event.issue.number }}. \n\nReview the code and merge if satisfactory! 🚀"
          branch: "ai-feature-${{ github.event.issue.number }}"
          delete-branch: true
