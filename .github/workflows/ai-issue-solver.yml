name: Ultimate AI Game Developer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-code-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Official Google AI SDK
        run: pip install google-generativeai

      - name: 4. Create and Execute AI Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > ai_brain.py
          import os
          import sys
          import re
          import google.generativeai as genai

          def main():
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("❌ Error: GEMINI_API_KEY is missing!")
                  sys.exit(1)

              # Using Official Google SDK
              genai.configure(api_key=api_key)

              issue_title = os.environ.get("ISSUE_TITLE", "No Title")
              issue_body = os.environ.get("ISSUE_BODY", "No Body")
              
              file_path = "index.html"
              
              current_code = ""
              if os.path.exists(file_path):
                  with open(file_path, "r", encoding="utf-8") as f:
                      current_code = f.read()

              prompt = f"""You are an elite expert game developer. Refactor and upgrade the HTML5 Canvas game. Make it ultra-smooth, high-graphics, and highly standard.
              
              Issue Title: {issue_title}
              Issue Description: {issue_body}
              
              Current Code:
              {current_code}
              
              STRICT RULES:
              1. Provide ONLY valid HTML/CSS/JS code. No explanations.
              2. Do NOT use external files. Write everything inside a single HTML file.
              3. DO NOT output markdown blocks like ```html. Start exactly with <!DOCTYPE html> and end with </html>.
              4. Make the game absolutely perfect, smooth, and high graphics.
              """

              print("⏳ Sending request using Official Google SDK...")
              try:
                  # Exact correct model name for SDK
                  model = genai.GenerativeModel('gemini-1.5-flash')
                  response = model.generate_content(prompt)
                  
                  new_code = response.text
                  
                  # Cleanup any unwanted Markdown tags
                  new_code = re.sub(r'^```(html|javascript|css)?\s*', '', new_code, flags=re.IGNORECASE)
                  new_code = re.sub(r'```$', '', new_code.strip())

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(new_code)
                      
                  print(f"✅ AI successfully generated the highly upgraded game code in {file_path}!")
              except Exception as e:
                  print(f"❌ Error during generation: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          
          python ai_brain.py

      - name: 5. Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: Mega High Graphics Update via Gemini AI"
          title: "🚀 Ultra Game Update: ${{ github.event.issue.title }}"
          body: "This powerful update was generated using the Official Gemini SDK."
          branch: "ultra-update-${{ github.event.issue.number }}"
          delete-branch: true
