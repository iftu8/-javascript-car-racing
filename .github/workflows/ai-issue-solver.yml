name: Ultimate AI Game Developer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-code-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # ৩০ মিনিট পর্যন্ত সময় দেওয়া হলো, যেন কোড অর্ধেক লিখে গিটহাব বন্ধ না করে দেয়!

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Requirements
        run: pip install requests

      - name: 4. Create and Execute AI Brain (Python Script)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > ai_brain.py
          import os
          import json
          import requests
          import sys
          import re

          def main():
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("❌ Error: GEMINI_API_KEY is missing!")
                  sys.exit(1)

              issue_title = os.environ.get("ISSUE_TITLE", "No Title")
              issue_body = os.environ.get("ISSUE_BODY", "No Body")
              
              file_path = "index.html"
              if not os.path.exists(file_path):
                  print(f"❌ Error: {file_path} not found.")
                  sys.exit(1)
                  
              with open(file_path, "r", encoding="utf-8") as f:
                  current_code = f.read()

              # 🚀 SMART AUTO-DETECT: এটি নিজে থেকে সবচেয়ে বেস্ট মডেলটি খুঁজে নেবে! (No more 404 Errors)
              print("🔍 Scanning for available Gemini models...")
              models_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
              try:
                  models_req = requests.get(models_url)
                  models_req.raise_for_status()
                  available_models = [m['name'].replace('models/', '') for m in models_req.json().get('models', [])]
              except Exception as e:
                  print("⚠️ Could not fetch models list. Using default stable model.")
                  available_models = ["gemini-1.5-flash-latest"]

              selected_model = "gemini-pro" # Fallback
              priority_list = ["gemini-1.5-pro-latest", "gemini-1.5-flash-latest", "gemini-1.5-pro", "gemini-1.5-flash"]
              
              for p in priority_list:
                  if p in available_models:
                      selected_model = p
                      break
              
              print(f"🎯 Successfully Selected Model: {selected_model}")

              # 🚀 PROMPT
              prompt = f"""You are an elite, senior game developer. Refactor and profoundly upgrade the HTML/JS game based on the GitHub issue below.
              
              Issue Title: {issue_title}
              Issue Description: {issue_body}
              
              Current Code:
              {current_code}
              
              STRICT RULES:
              1. Return ONLY valid, highly optimized, and bug-free HTML/CSS/JS code. No explanations.
              2. DO NOT include markdown formatting like ```html or ```.
              3. The code must start exactly with <!DOCTYPE html> and end with </html>.
              4. Everything must remain in a single file (`index.html`). Do not use external files.
              5. Provide the FULL updated file, do not truncate or leave placeholders.
              """

              url = f"https://generativelanguage.googleapis.com/v1beta/models/{selected_model}:generateContent?key={api_key}"
              
              headers = {"Content-Type": "application/json"}
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 8192
                  }
              }

              print(f"⏳ Sending massive request to {selected_model}... This might take 10-20 minutes. Please wait.")
              try:
                  # ২০ মিনিট (1200 seconds) পর্যন্ত API রেসপন্সের জন্য অপেক্ষা করবে
                  response = requests.post(url, headers=headers, json=payload, timeout=1200)
                  response.raise_for_status()
              except Exception as e:
                  print(f"❌ API Request Failed: {e}")
                  if hasattr(response, 'text'):
                      print(f"API Error Details: {response.text}")
                  sys.exit(1)

              data = response.json()
              try:
                  new_code = data["candidates"][0]["content"]["parts"][0]["text"]
              except (KeyError, IndexError) as e:
                  print(f"❌ Failed to parse Gemini response. API might have blocked the request.")
                  print(json.dumps(data, indent=2))
                  sys.exit(1)

              # 🧹 CLEANUP MARKDOWN BUGS
              new_code = re.sub(r'^```(html|javascript|css)?\s*', '', new_code, flags=re.IGNORECASE)
              new_code = re.sub(r'```$', '', new_code.strip())

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(new_code)
                  
              print("✅ AI successfully engineered and rewrote the massive code!")

          if __name__ == "__main__":
              main()
          EOF
          
          python ai_brain.py

      - name: 5. Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: The Ultimate AI Game Update for #${{ github.event.issue.number }}"
          title: "🚀 Massive AI Update: ${{ github.event.issue.title }}"
          body: "This massive code upgrade was successfully engineered by the **Smart AI Engine** for Issue #${{ github.event.issue.number }}.\n\nPlease review the changes and merge! 🎮"
          branch: "ai-massive-update-${{ github.event.issue.number }}"
          delete-branch: true
