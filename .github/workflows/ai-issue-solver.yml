name: Ultimate AI Game Developer (vMAX)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ultimate-ai-coder:
    name: 🧠 Massive AI Engine Processing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🚀 1. Checkout Game Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 2. Setup Python Ultra Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ 3. Execute The VIP AI Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > ultimate_ai_brain.py
          import os, sys, json, time, re, urllib.request, urllib.error

          def main():
              print("==================================================")
              print("🚀 INITIATING ULTIMATE AI VIP ENGINE...")
              print("==================================================")
              
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("❌ CRITICAL ERROR: GEMINI_API_KEY is missing!")
                  sys.exit(1)

              issue_title = os.environ.get("ISSUE_TITLE", "Game Update")
              issue_body = os.environ.get("ISSUE_BODY", "Update features")
              file_path = "index.html"
              
              current_code = ""
              if os.path.exists(file_path):
                  with open(file_path, "r", encoding="utf-8") as f:
                      current_code = f.read()
              else:
                  print(f"⚠️ Warning: {file_path} not found. Creating from scratch.")

              prompt = f"""You are an elite, senior game developer. Refactor, upgrade, and add features to the HTML5 game based on the GitHub issue below.
              
              Issue Title: {issue_title}
              Issue Description: {issue_body}
              
              Current Code:
              {current_code}
              
              STRICT RULES:
              1. Return ONLY valid, optimized HTML/CSS/JS code. No explanations.
              2. DO NOT output ```html markdown blocks.
              3. Start exactly with <!DOCTYPE html> and end with </html>.
              4. Everything must remain in a single file (`index.html`).
              """

              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.2, "maxOutputTokens": 8192}
              }
              data = json.dumps(payload).encode('utf-8')
              headers = {"Content-Type": "application/json"}

              # 🏆 VIP List of Models (No auto-scanner confusion, just the best coding models)
              vip_models = [
                  "gemini-1.5-pro",
                  "gemini-1.5-flash",
                  "gemini-2.0-flash",
                  "gemini-3.0-flash"
              ]

              success = False
              for model in vip_models:
                  print(f"\n📡 Trying VIP Model: {model} ...")
                  url = f"[https://generativelanguage.googleapis.com/v1beta/models/](https://generativelanguage.googleapis.com/v1beta/models/){model}:generateContent?key={api_key}"
                  
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method="POST")
                      with urllib.request.urlopen(req, timeout=1200) as response:
                          result = json.loads(response.read().decode('utf-8'))
                          
                      new_code = result["candidates"][0]["content"]["parts"][0]["text"]
                      new_code = re.sub(r'^```(html|javascript|css)?\s*', '', new_code, flags=re.IGNORECASE)
                      new_code = re.sub(r'```$', '', new_code.strip())

                      with open(file_path, "w", encoding="utf-8") as f:
                          f.write(new_code)
                          
                      print(f"🎉 BOOM! AI successfully generated code using {model}!")
                      success = True
                      break # ✅ Job done, exit the loop!

                  except urllib.error.HTTPError as e:
                      error_msg = e.read().decode('utf-8')
                      if e.code == 429:
                          print(f"⚠️ Quota Exceeded (429) for {model}. Trying next model...")
                      elif e.code == 404:
                          print(f"⚠️ Model {model} not found (404). Trying next model...")
                      else:
                          print(f"❌ HTTP {e.code} for {model}: {error_msg}")
                  except Exception as e:
                      print(f"❌ Error with {model}: {e}")

              if not success:
                  print("\n🚨 CRITICAL: All VIP models failed. Your API Key quota is completely exhausted!")
                  print("👉 PLEASE GENERATE A BRAND NEW API KEY FROM GOOGLE AI STUDIO.")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          
          python ultimate_ai_brain.py

      - name: 📦 4. Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: Ultimate AI Upgrade via VIP Engine"
          title: "🚀 Massive Game Update: ${{ github.event.issue.title }}"
          body: "This update was generated perfectly using the VIP Model Fallback Engine."
          branch: "ultimate-update-${{ github.event.issue.number }}"
          delete-branch: true
