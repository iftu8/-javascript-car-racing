name: Ultimate AI Game Developer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-code-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Requirements
        run: pip install requests

      - name: 4. Create and Execute AI Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > ai_brain.py
          import os
          import json
          import requests
          import sys
          import re

          def main():
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("❌ Error: GEMINI_API_KEY is missing!")
                  sys.exit(1)

              issue_title = os.environ.get("ISSUE_TITLE", "No Title")
              issue_body = os.environ.get("ISSUE_BODY", "No Body")
              file_path = "index.html"
              
              current_code = ""
              if os.path.exists(file_path):
                  with open(file_path, "r", encoding="utf-8") as f:
                      current_code = f.read()

              prompt = f"""You are an elite expert game developer. Refactor and upgrade the HTML5 Canvas game. Make it ultra-smooth, high-graphics, and highly standard.
              
              Issue Title: {issue_title}
              Issue Description: {issue_body}
              
              Current Code:
              {current_code}
              
              STRICT RULES:
              1. Provide ONLY valid HTML/CSS/JS code. No explanations.
              2. Do NOT use external files. Write everything inside a single HTML file.
              3. DO NOT output markdown blocks like ```html. Start exactly with <!DOCTYPE html> and end with </html>.
              """

              # 🚀 FIX: Directly using the brand new model requested by Google
              model_name = "gemini-3.0-flash"
              url = f"[https://generativelanguage.googleapis.com/v1beta/models/](https://generativelanguage.googleapis.com/v1beta/models/){model_name}:generateContent?key={api_key}"
              
              headers = {"Content-Type": "application/json"}
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 8192
                  }
              }

              print(f"⏳ Sending Direct API request to {model_name}... Please wait.")
              try:
                  response = requests.post(url, headers=headers, json=payload, timeout=1200)
                  response.raise_for_status()
                  data = response.json()
                  
                  new_code = data["candidates"][0]["content"]["parts"][0]["text"]
                  
                  # Clean up markdown formats
                  new_code = re.sub(r'^```(html|javascript|css)?\s*', '', new_code, flags=re.IGNORECASE)
                  new_code = re.sub(r'```$', '', new_code.strip())

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(new_code)
                      
                  print(f"✅ AI successfully engineered the game using the powerful {model_name}!")
              except Exception as e:
                  print(f"❌ Error during generation: {e}")
                  if 'response' in locals() and hasattr(response, 'text'):
                      print(f"API Error Details: {response.text}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          
          python ai_brain.py

      - name: 5. Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: Mega AI Update via Gemini 3.0"
          title: "🚀 Ultra Game Update: ${{ github.event.issue.title }}"
          body: "This update was flawlessly generated using the brand new Gemini 3.0 Flash API."
          branch: "ultra-update-${{ github.event.issue.number }}"
          delete-branch: true
