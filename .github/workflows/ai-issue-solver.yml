name: Auto AI Issue Resolver

on:
  issues:
    types: [opened, labeled]

jobs:
  ai-solve:
    if: contains(github.event.issue.labels.*.name, 'ai-fix') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Call Gemini API & Update Code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
          const fs = require("fs");
          async function run() {
            const prompt = `You are a web developer. Fix or update the code in index.html based on this issue: Title: ${process.env.ISSUE_TITLE}, Details: ${process.env.ISSUE_BODY}. Output ONLY the updated full valid HTML code, without markdown ticks.`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            let newCode = data.candidates[0].content.parts[0].text;
            newCode = newCode.replace(/```html/g, "").replace(/```/g, "").trim();
            fs.writeFileSync("index.html", newCode);
          }
          run();
          '

      - name: Create Pull Request with AI Changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: auto-updated code via AI for Issue #${{ github.event.issue.number }}"
          title: "🤖 AI Fix for Issue: ${{ github.event.issue.title }}"
          body: "This PR was automatically generated by Gemini AI to address Issue #${{ github.event.issue.number }}."
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
