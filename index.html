<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OMEGA 3D - Ultimate Cyberpunk Racing Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stat-box {
            background: rgba(10, 10, 25, 0.75);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            border-radius: 8px;
            padding: 15px 25px;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }
        .speedometer-container {
            position: absolute;
            bottom: 30px;
            right: 40px;
            text-align: center;
            background: rgba(10, 10, 25, 0.85);
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        #speed-val {
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
            font-weight: 900;
            line-height: 1;
        }
        .speed-label {
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 3px;
            margin-top: 5px;
        }
        .health-bar-container {
            width: 250px;
            height: 20px;
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00ff66;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            margin-top: 10px;
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff66, #00f3ff);
            box-shadow: 0 0 10px #00ff66;
            transition: width 0.2s ease;
        }
        #nitro-bar-container {
            width: 250px;
            height: 12px;
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #ffaa00;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
            margin-top: 8px;
        }
        #nitro-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            box-shadow: 0 0 10px #ffaa00;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 8, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        h1 {
            font-size: 5rem;
            color: #00f3ff;
            text-shadow: 0 0 30px #00f3ff, 0 0 60px #ff0055;
            margin: 0 0 10px 0;
            letter-spacing: 6px;
            font-weight: 900;
            font-style: italic;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }
        .btn {
            background: linear-gradient(45deg, #00f3ff, #ff0055);
            border: none;
            color: white;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.9);
        }
        .controls-hint {
            margin-top: 30px;
            color: #888;
            font-size: 1rem;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.6;
        }
        .controls-hint span {
            color: #00f3ff;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0,243,255,0.3);
        }
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none;
            gap: 15px;
            pointer-events: auto;
            z-index: 20;
        }
        .mob-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        #mobile-actions {
            position: absolute;
            bottom: 20px;
            right: 200px;
            display: none;
            gap: 15px;
            pointer-events: auto;
            z-index: 20;
        }
        @media (max-width: 1024px) {
            #mobile-controls, #mobile-actions { display: flex; }
        }
    </style>

    <!-- Dependencies via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="hud">
        <div class="hud-top">
            <div class="stat-box">
                SCORE: <span id="score-val">0</span>
                <div class="health-bar-container"><div id="health-fill"></div></div>
                <div class="health-bar-container" id="nitro-bar-container"><div id="nitro-fill"></div></div>
            </div>
            <div class="stat-box">
                RANK: <span id="rank-val" style="color:#00f3ff;">1st / 4</span>
            </div>
        </div>
        <div class="speedometer-container">
            <div id="speed-val">0</div>
            <div class="speed-label">KM/H</div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="mob-btn" id="btn-left">◀</div>
        <div class="mob-btn" id="btn-right">▶</div>
    </div>
    <div id="mobile-actions">
        <div class="mob-btn" id="btn-accel" style="border-color:#ff0055; background:rgba(255,0,85,0.2);">▲</div>
        <div class="mob-btn" id="btn-nitro" style="border-color:#ffaa00; background:rgba(255,170,0,0.2);">⚡</div>
    </div>

    <div id="overlay">
        <h1>OMEGA OMEGA</h1>
        <div class="subtitle">ULTRA CYBERPUNK 3D RACING ENGINE</div>
        <button class="btn" id="start-btn">ENGAGE ENGINE</button>
        <div class="controls-hint">
            STEER: <span>A / D</span> or <span>ARROWS</span> | ACCELERATE: <span>W</span> | NITRO: <span>SHIFT</span>
        </div>
    </div>

    <script>
        /**
         * OMEGA 3D RACING ENGINE - PRODUCTION READY SINGLE-FILE ARCHITECTURE
         */
        class OmegaGame {
            constructor() {
                this.isRunning = false;
                this.score = 0;
                this.health = 100;
                this.nitro = 100;
                this.speed = 0;
                this.maxSpeed = 160;
                this.acceleration = 45;
                this.braking = 70;
                this.friction = 25;
                this.steering = 0;
                this.maxSteering = 0.035;
                this.carPos = new THREE.Vector3(0, 0.5, 0);
                this.carAngle = 0;
                this.trackSegments = [];
                this.segmentLength = 60;
                this.renderDistance = 25;
                this.currentSegmentIndex = 0;
                this.obstacles = [];
                this.boosters = [];
                this.aiOpponents = [];
                this.particles = [];
                
                this.keys = { forward: false, backward: false, left: false, right: false, nitro: false };
                
                this.initEngine();
                this.initWorld();
                this.initPlayerCar();
                this.initAIOpponents();
                this.initListeners();
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x05050a, 0.0035);

                this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.3;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                // Post-Processing Bloom
                this.composer = new THREE.EffectComposer(this.renderer);
                const renderPass = new THREE.RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.4, 0.85);
                this.composer.addPass(bloomPass);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x111122, 1.5);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0x00f3ff, 2.0);
                dirLight.position.set(100, 200, 100);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                this.scene.add(dirLight);

                window.addEventListener('resize', () => this.onWindowResize());
            }

            initWorld() {
                // Skybox / Starfield
                const starsGeo = new THREE.BufferGeometry();
                const starsCount = 2000;
                const starPositions = new Float32Array(starsCount * 3);
                for(let i=0; i<starsCount*3; i+=3) {
                    starPositions[i] = (Math.random() - 0.5) * 1500;
                    starPositions[i+1] = Math.random() * 800 + 100;
                    starPositions[i+2] = (Math.random() - 0.5) * 1500;
                }
                starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 2});
                const starField = new THREE.Points(starsGeo, starsMat);
                this.scene.add(starField);

                // Generate Initial Track Segments
                for (let i = 0; i < this.renderDistance; i++) {
                    this.generateTrackSegment(i * this.segmentLength);
                }
            }

            generateTrackSegment(zPos) {
                const group = new THREE.Group();
                group.position.z = zPos;

                // Road Base
                const roadGeo = new THREE.PlaneGeometry(30, this.segmentLength);
                const roadMat = new THREE.MeshStandardMaterial({ 
                    color: 0x111118, 
                    roughness: 0.4, 
                    metalness: 0.8 
                });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.rotation.x = -Math.PI / 2;
                road.receiveShadow = true;
                group.add(road);

                // Neon Grid Lines
                const gridGeo = new THREE.PlaneGeometry(28, this.segmentLength);
                const gridMat = new THREE.MeshBasicMaterial({ 
                    color: 0x00f3ff, 
                    wireframe: true,
                    transparent: true,
                    opacity: 0.25
                });
                const grid = new THREE.Mesh(gridGeo, gridMat);
                grid.rotation.x = -Math.PI / 2;
                grid.position.y = 0.05;
                group.add(grid);

                // Neon Side Strips
                const stripGeo = new THREE.BoxGeometry(0.8, 0.4, this.segmentLength);
                const stripMatL = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const stripMatR = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                
                const stripL = new THREE.Mesh(stripGeo, stripMatL);
                stripL.position.set(-15, 0.2, 0);
                group.add(stripL);

                const stripR = new THREE.Mesh(stripGeo, stripMatR);
                stripR.position.set(15, 0.2, 0);
                group.add(stripR);

                // Cyberpunk Skyscrapers / Buildings on sides
                if (zPos > 100) {
                    for (let side of [-1, 1]) {
                        const h = 80 + Math.random() * 120;
                        const bGeo = new THREE.BoxGeometry(20, h, 30);
                        const bMat = new THREE.MeshStandardMaterial({ 
                            color: 0x080812, 
                            roughness: 0.2, 
                            metalness: 0.9,
                            emissive: Math.random() > 0.5 ? 0xff0055 : 0x00f3ff,
                            emissiveIntensity: 0.1
                        });
                        const building = new THREE.Mesh(bGeo, bMat);
                        building.position.set(side * 35, h / 2, 0);
                        building.castShadow = true;
                        group.add(building);
                    }

                    // Obstacles & Boosters spawn randomly
                    if (Math.random() < 0.4) {
                        const obsGeo = new THREE.BoxGeometry(4, 3, 4);
                        const obsMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.8 });
                        const obs = new THREE.Mesh(obsGeo, obsMat);
                        obs.position.set((Math.random() - 0.5) * 20, 1.5, (Math.random() - 0.5) * 30);
                        obs.castShadow = true;
                        group.add(obs);
                        this.obstacles.push({ mesh: obs, group: group, hit: false });
                    }

                    if (Math.random() < 0.3) {
                        const boostGeo = new THREE.CylinderGeometry(2, 2, 0.5, 16);
                        const boostMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                        const boost = new THREE.Mesh(boostGeo, boostMat);
                        boost.position.set((Math.random() - 0.5) * 20, 0.3, (Math.random() - 0.5) * 30);
                        group.add(boost);
                        this.boosters.push({ mesh: boost, group: group, collected: false });
                    }
                }

                this.scene.add(group);
                this.trackSegments.push(group);
            }

            initPlayerCar() {
                this.carGroup = new THREE.Group();

                // Sleek Cyberpunk Sports Car Chassis
                const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.5);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0x0f0f1a, 
                    metalness: 0.9, 
                    roughness: 0.1,
                    envMapIntensity: 1.5
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.6;
                body.castShadow = true;
                this.carGroup.add(body);

                // Cockpit Glass
                const glassGeo = new THREE.BoxGeometry(1.6, 0.6, 2.2);
                const glassMat = new THREE.MeshPhysicalMaterial({ 
                    color: 0x00f3ff, 
                    transparent: true, 
                    opacity: 0.6, 
                    roughness: 0.05,
                    metalness: 0.9
                });
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.position.set(0, 1.1, -0.2);
                this.carGroup.add(glass);

                // Neon Underglow / Trim
                const trimGeo = new THREE.BoxGeometry(2.3, 0.1, 4.6);
                const trimMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const trim = new THREE.Mesh(trimGeo, trimMat);
                trim.position.y = 0.25;
                this.carGroup.add(trim);

                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
                
                this.wheels = [];
                const wheelPositions = [
                    [-1.2, 0.4, 1.5], [1.2, 0.4, 1.5],
                    [-1.2, 0.4, -1.5], [1.2, 0.4, -1.5]
                ];
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    this.carGroup.add(wheel);
                    this.wheels.push(wheel);
                });

                this.scene.add(this.carGroup);
            }

            initAIOpponents() {
                this.aiOpponents = [];
                const colors = [0x00ff66, 0xffaa00, 0x9900ff];
                for (let i = 0; i < 3; i++) {
                    const aiGroup = this.carGroup.clone();
                    aiGroup.children[2].material = new THREE.MeshBasicMaterial({ color: colors[i] }); // Change underglow color
                    const aiData = {
                        group: aiGroup,
                        pos: new THREE.Vector3((i - 1) * 6, 0.5, -50 - (i * 40)),
                        speed: 110 + Math.random() * 20,
                        targetX: (Math.random() - 0.5) * 20
                    };
                    aiGroup.position.copy(aiData.pos);
                    this.scene.add(aiGroup);
                    this.aiOpponents.push(aiData);
                }
            }

            initListeners() {
                window.addEventListener('keydown', (e) => this.handleKey(e, true));
                window.addEventListener('keyup', (e) => this.handleKey(e, false));

                document.getElementById('start-btn').addEventListener('click', () => {
                    document.getElementById('overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
                    this.isRunning = true;
                    this.lastTime = performance.now();
                    this.loop();
                });

                // Mobile Bindings
                const bindTouch = (id, key) => {
                    const el = document.getElementById(id);
                    el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[key] = true; });
                    el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[key] = false; });
                };
                bindTouch('btn-left', 'left');
                bindTouch('btn-right', 'right');
                bindTouch('btn-accel', 'forward');
                bindTouch('btn-nitro', 'nitro');
            }

            handleKey(e, isDown) {
                switch(e.key.toLowerCase()) {
                    case 'w': case 'arrowup': this.keys.forward = isDown; break;
                    case 's': case 'arrowdown': this.keys.backward = isDown; break;
                    case 'a': case 'arrowleft': this.keys.left = isDown; break;
                    case 'd': case 'arrowright': this.keys.right = isDown; break;
                    case 'shift': this.keys.nitro = isDown; break;
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }

            spawnParticles(pos, color, count = 5) {
                for(let i=0; i<count; i++) {
                    const pGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                    const pMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 });
                    const p = new THREE.Mesh(pGeo, pMat);
                    p.position.copy(pos);
                    p.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 5,
                        Math.random() * 5,
                        (Math.random() - 0.5) * 5 - 10
                    );
                    this.scene.add(p);
                    this.particles.push({ mesh: p, life: 1.0 });
                }
            }

            update(dt) {
                // Acceleration & Physics
                let currentMaxSpeed = this.maxSpeed;
                if (this.keys.nitro && this.nitro > 0) {
                    currentMaxSpeed *= 1.5;
                    this.nitro = Math.max(0, this.nitro - dt * 35);
                    this.spawnParticles(this.carPos.clone().add(new THREE.Vector3(0,0.5,2)), 0xffaa00, 3);
                } else {
                    this.nitro = Math.min(100, this.nitro + dt * 10);
                }

                if (this.keys.forward) {
                    this.speed = Math.min(currentMaxSpeed, this.speed + this.acceleration * dt);
                } else if (this.keys.backward) {
                    this.speed = Math.max(-40, this.speed - this.braking * dt);
                } else {
                    this.speed -= this.friction * dt;
                    if (this.speed < 0) this.speed = 0;
                }

                // Steering
                if (this.keys.left) {
                    this.steering = Math.min(this.maxSteering, this.steering + 0.005);
                    this.carAngle += 1.2 * dt;
                } else if (this.keys.right) {
                    this.steering = Math.max(-this.maxSteering, this.steering - 0.005);
                    this.carAngle -= 1.2 * dt;
                } else {
                    this.steering *= 0.85;
                }

                this.carPos.x -= this.steering * (this.speed * 0.5);
                this.carPos.x = Math.max(-13, Math.min(13, this.carPos.x)); // Road boundaries
                this.carPos.z -= this.speed * dt;

                this.carGroup.position.copy(this.carPos);
                this.carGroup.rotation.y = this.steering * 8;
                this.carGroup.rotation.z = -this.steering * 4;

                // Infinite Track Streaming
                const activeSegmentIndex = Math.floor(Math.abs(this.carPos.z) / this.segmentLength);
                if (activeSegmentIndex > this.currentSegmentIndex) {
                    this.currentSegmentIndex = activeSegmentIndex;
                    // Recycle / Generate ahead
                    const furthestZ = -((this.currentSegmentIndex + this.renderDistance - 1) * this.segmentLength);
                    const oldestSegment = this.trackSegments.shift();
                    if (oldestSegment) {
                        oldestSegment.position.z = furthestZ;
                        this.trackSegments.push(oldestSegment);
                    }
                }

                // AI Logic
                this.aiOpponents.forEach((ai, idx) => {
                    ai.pos.z -= ai.speed * dt;
                    if (Math.abs(ai.pos.z - this.carPos.z) > 1000) {
                        ai.pos.z = this.carPos.z - 500 - Math.random() * 200;
                    }
                    ai.group.position.copy(ai.pos);
                });

                // Obstacle Collision Check
                this.obstacles.forEach(obs => {
                    const worldPos = new THREE.Vector3();
                    obs.mesh.getWorldPosition(worldPos);
                    if (worldPos.distanceTo(this.carPos) < 2.5 && !obs.hit) {
                        obs.hit = true;
                        this.health -= 25;
                        this.speed *= 0.3;
                        this.spawnParticles(worldPos, 0xff0000, 15);
                        obs.mesh.visible = false;
                        if (this.health <= 0) {
                            alert("SYSTEM FAILURE: RACE OVER. Score: " + Math.floor(this.score));
                            location.reload();
                        }
                    }
                });

                // Booster Collection Check
                this.boosters.forEach(boost => {
                    const worldPos = new THREE.Vector3();
                    boost.mesh.getWorldPosition(worldPos);
                    if (worldPos.distanceTo(this.carPos) < 3.0 && !boost.collected) {
                        boost.collected = true;
                        this.nitro = Math.min(100, this.nitro + 40);
                        this.score += 500;
                        this.spawnParticles(worldPos, 0xffaa00, 10);
                        boost.mesh.visible = false;
                    }
                });

                // Particle Updates
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.mesh.position.addScaledVector(p.velocity, dt);
                    p.life -= dt * 2;
                    p.mesh.material.opacity = p.life;
                    if (p.life <= 0) {
                        this.scene.remove(p.mesh);
                        this.particles.splice(i, 1);
                    }
                }

                // Camera Follow with Lag
                const targetCamPos = new THREE.Vector3(
                    this.carPos.x * 0.5,
                    this.carPos.y + 3.5,
                    this.carPos.z + 8.5
                );
                this.camera.position.lerp(targetCamPos, 0.15);
                this.camera.lookAt(this.carPos.clone().add(new THREE.Vector3(0, 1, -5)));

                // Update HUD
                this.score += Math.floor(this.speed * dt * 0.5);
                document.getElementById('speed-val').innerText = Math.floor(this.speed * 2.2); // km/h scale
